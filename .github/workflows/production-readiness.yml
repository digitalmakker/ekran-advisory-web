name: production-readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run qa:source
      - run: npm run build
      - run: npm run qa:built
